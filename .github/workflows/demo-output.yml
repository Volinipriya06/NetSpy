name: NetSpy Demo Output

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-demo-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run authorized loopback scan
        run: python netspy.py 127.0.0.1 | tee netspy-demo-output.txt

      - name: Upload terminal output
        uses: actions/upload-artifact@v4
        with:
          name: netspy-demo-output
          path: netspy-demo-output.txt
          if-no-files-found: error
